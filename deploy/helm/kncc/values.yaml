# ==============================================================================
# kncc — Kubernetes Network Connectivity Checker
# Helm Chart Default Values
# ==============================================================================
# This file contains comprehensive descriptions of each configuration parameter
# for quick start and production tuning of kncc in Kubernetes.
#
# For each parameter, explanations include:
#   - Parameter purpose and runtime impact on service behavior.
#   - Administrator recommendations (whether to modify or keep defaults).
#   - Security guidelines (PoLP, secret protection, Anti-SSRF).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Base Deployment Settings
# ------------------------------------------------------------------------------

# Number of kncc server pod replicas.
# WARNING: Keep value set to 1! kncc uses an embedded SQLite database (/data/kncc.db).
# SQLite strictly requires a single writing process (Single Writer).
# Increasing replicas (> 1) leads to database locks ("database is locked")
# or data desynchronization between pods when using local storage.
replicaCount: 1

image:
  # Container image repository for the kncc backend server.
  # Change when using private, corporate, or air-gapped registries:
  # e.g., "harbor.corp.example.com/kncc/kncc" or "ghcr.io/AleksandrSumkin/kncc".
  repository: ghcr.io/aleksandrsumkin/kncc

  # Kubernetes image pull policy (IfNotPresent, Always, Never).
  # Recommended:
  #   - "IfNotPresent" for stable release versions (saves bandwidth and accelerates restarts).
  #   - "Always" when using floating tags ("latest", "dev") to enforce updates.
  pullPolicy: IfNotPresent

  # Image tag override.
  # Defaults to empty ("") — chart automatically uses the appVersion from Chart.yaml.
  # Specify an explicit tag (e.g. "1.13.0") to pin a container version independently of the chart.
  tag: ""

# List of Kubernetes Secret names for authenticating against private container registries (imagePullSecrets).
# Example:
#   imagePullSecrets:
#     - name: "corp-registry-secret"
# Leave empty ([]) if pulling from public registries without authentication.
imagePullSecrets: []

# Partial override for the chart base name in created resources.
# Leave empty (""). Used when embedding kncc as a subchart in umbrella charts.
nameOverride: ""

# Full override for all created resource names (Deployment, Service, ConfigMap, etc.).
# Leave empty ("") to auto-generate names formatted as "<release-name>-kncc".
# Specify a string (up to 63 chars) if cluster governance requires fixed resource names.
fullnameOverride: ""

# ------------------------------------------------------------------------------
# 2. Application Server and Protocols (Server & API)
# ------------------------------------------------------------------------------

server:
  # Network interface IP address to listen on for incoming HTTP connections.
  # Keep "0.0.0.0" to accept traffic across all container interfaces.
  # Setting "127.0.0.1" makes the service unreachable to Kubernetes Service and Ingress.
  host: "0.0.0.0"

  # Primary HTTP REST API and Web UI port inside the container.
  # Default: 8080 (standard non-privileged port).
  port: 8080

  # Application logging level.
  # Controls log verbosity across all backend modules, including authentication connectors (LDAP, OIDC),
  # Kubernetes probe runners, garbage collection, and HTTP API endpoints.
  # Supported values: "debug", "info", "warn", "error".
  # Default: "info" (production-safe default balancing visibility and log volume).
  # Set to "debug" for troubleshooting connection issues, directory searches, or token exchanges.
  logLevel: "info"

  # User authorization JWT token time-to-live (Go duration format: "8h", "24h", "7d").
  # When expired, user session ends and re-authentication is required.
  # Recommended: "24h" for operator convenience, or "4h"-"8h" for high-security environments.
  tokenTTL: "24h"

  # Built-in HTTPS/TLS server configuration on dedicated container port.
  tls:
    # Enable kncc direct TLS server.
    # Keep false if TLS terminates at an ingress controller or Gateway API.
    # Enable (true) in Zero-Trust clusters requiring End-to-End pod encryption.
    enabled: true

    # Dedicated HTTPS container port (default: 8443).
    port: 8443

    # Automatically generate self-signed ECDSA P-256 certificate on pod startup.
    # Operates only when no custom certificates or secret are configured.
    # Convenient for rapid HTTPS verification in dev environments without PKI setup.
    autoGenerate: true

    # Paths to certificate (.crt/.pem) and private key (.key) files inside container
    # if mounted manually via external volumes.
    certFile: ""
    keyFile: ""

    # Raw PEM certificate and private key string directly in values.
    # Used for quick certificate provisioning without managing separate Secret manifests.
    certPem: ""
    keyPem: ""

    # Minimum supported TLS protocol version ("1.2" or "1.3").
    # "1.3" disables legacy cipher suites, but requires modern TLS clients.
    minVersion: "1.2"

    # Name of existing Kubernetes Secret containing certificate (tls.crt) and key (tls.key).
    # Recommended production approach when using HashiCorp Vault / External Secrets Operator.
    existingSecret: ""

    # Mount path for TLS secret in kncc container filesystem.
    mountPath: "/etc/kncc-tls"

    # cert-manager integration for automated server TLS certificate issuance and rotation.
    certManager:
      # Whether to create a cert-manager.io/v1 Certificate resource for kncc server.
      enabled: false

      # Reference to cert-manager certificate issuer.
      issuerRef:
        name: ""              # Name of ClusterIssuer or Issuer (e.g., "letsencrypt-prod" or "corp-ca")
        kind: "ClusterIssuer" # Issuer type: "ClusterIssuer" (cluster-wide) or "Issuer" (namespaced)
        group: "cert-manager.io"

      # Subject Alternative Names (DNS names) for certificate (e.g. ["kncc.example.com", "kncc.kncc.svc"]).
      dnsNames: []

      # IP addresses to include in SAN list.
      ipAddresses: []

      # Certificate total validity period (default: 1 year).
      duration: "8760h"

      # Duration before expiration when cert-manager initiates automated renewal (30 days prior).
      renewBefore: "720h"

  # OpenAPI 3.x / Swagger UI interactive API specification configuration.
  openapi:
    # Enable documentation endpoints (/api/docs, /api/openapi.json, /api/openapi.yaml).
    # Keep true for integration with external systems and automated consumers.
    enabled: true

    # Public unauthenticated access mode.
    # When false (default), viewing /api/docs requires a valid JWT token (user or admin role).
    # Set to true in dev/preview environments to allow DAST scanners (OWASP ZAP, Nuclei) to audit API without auth.
    public: false

# ------------------------------------------------------------------------------
# 3. Kubernetes Network Probe Engine (Probe Engine & GC)
# ------------------------------------------------------------------------------

k8s:
  # Container image for ephemeral kncc-probe diagnostic pods scheduled on cluster nodes.
  #
  # Supported and tested probe images:
  #   - "ghcr.io/aleksandrsumkin/kncc-agent:latest":
  #       STRONGLY RECOMMENDED. Native ultra-lightweight kncc image (~15 MB).
  #       Contains minimal required tools: curl, openssl, netcat, ping, ca-certificates, bind-tools.
  #       Zero Attack Surface, instant cold start, 0 known CVEs.
  #   - "wbitt/network-multitool:alpine-extra":
  #       Available directly on Docker Hub without requiring a local container registry.
  #   - "wbitt/network-multitool:minimal":
  #       Lightweight multitool flavor (~40 MB).
  #   - "nicolaka/netshoot:latest":
  #       Comprehensive Swiss Army knife for network troubleshooting (~400 MB). Useful for manual kubectl exec.
  #   - "curlimages/curl:latest":
  #       Minimal curl image (~15 MB). ONLY supports HTTP/HTTPS (TCP/UDP/ICMP checks will fail).
  probeImage: "ghcr.io/aleksandrsumkin/kncc-agent:latest"

  # Timeout for a single network diagnostic probe operation (in seconds).
  # Applied to TCP handshake, HTTP request, UDP test, and ICMP ping.
  # Increase (up to 45-60s) when probing high-latency satellite links or slow remote targets.
  probeTimeoutSeconds: 30

  # Hard deadline for probe pod lifecycle in Kubernetes (activeDeadlineSeconds).
  # If a node freezes or network test hangs, Kubernetes forcefully terminates the pod
  # after this deadline expires. Must exceed probeTimeoutSeconds.
  probeActiveDeadlineSeconds: 60

  # Controls allowPrivilegeEscalation in probe pod SecurityContext.
  # When true (default), unprivileged probe containers (such as kncc-agent running as UID 10001)
  # are permitted to utilize the SUID bit on /bin/ping to acquire the NET_RAW capability,
  # enabling ICMP checks in HostNetwork mode without granting any extra capabilities.
  probeAllowPrivilegeEscalation: true

  # Image pull policy for ephemeral probe pods (Always, IfNotPresent, Never).
  # If empty, Kubernetes defaults are used.
  probeImagePullPolicy: ""

  # Pre-existing ImagePullSecrets for probe pods pulling from private registries.
  # The cluster administrator must ensure these secrets exist in all probed namespaces.
  probeImagePullSecrets: []
    # - name: "my-registry-secret"

  # Additional labels applied to ephemeral probe pods.
  # If a key conflicts with default kncc labels, the custom label takes precedence and a warning is logged.
  probeExtraLabels: {}
    # team: "network"

  # Additional annotations applied to ephemeral probe pods.
  # Useful for corporate auditing, custom schedulers, or disabling Service Mesh sidecars (e.g. Istio / Linkerd).
  probeExtraAnnotations: {}
    # sidecar.istio.io/inject: "false"

  # Optional PriorityClass name for probe pods (e.g. "system-cluster-critical").
  probePriorityClassName: ""

  # Custom CPU and Memory resource requirements for probe pods.
  # If not specified, default template values apply (requests: 10m/32Mi, limits: 100m/128Mi).
  # Conflicts with default quantities take precedence and trigger a server WARN log.
  probeResources: {}
    # requests:
    #   cpu: "10m"
    #   memory: "32Mi"
    # limits:
    #   cpu: "100m"
    #   memory: "128Mi"

  # Additional PodSecurityContext settings for probe pods.
  probePodSecurityContext: {}
    # runAsNonRoot: true
    # runAsUser: 10001
    # fsGroup: 10001

  # Additional SecurityContext settings for probe container.
  # Extends/overrides template container security context with precedence and WARN logging.
  probeSecurityContext: {}
    # readOnlyRootFilesystem: false
    # capabilities:
    #   drop:
    #     - ALL
    #   add:
    #     - NET_RAW

  # Background Garbage Collector execution interval.
  # Periodically inspects cluster and cleans up completed kncc-probe pods.
  gcInterval: "2m"

  # Minimum age threshold for orphaned pods before garbage collection.
  # Race condition protection: ensures GC does not terminate freshly completed pods
  # while the kncc backend is reading diagnostic results from termination-log.
  gcStaleThreshold: "3m"

  # Kubernetes Namespace Discovery dropdown configuration:
  #   - false (default): Principle of Least Privilege (PoLP). Users enter namespaces manually.
  #     kncc ServiceAccount is NOT granted cluster-wide namespace read permissions.
  #   - true: Displays an interactive namespace dropdown in UI, and grants
  #     "namespaces: [get, list, watch]" permissions to kncc ClusterRole.
  namespaceListEnabled: true

  # Blacklist of namespaces hidden from UI dropdown and permanently
  # forbidden from running checks at API server level (Anti-Bypass security).
  namespaceExcludeList:
    - "kube-system"
    - "kube-public"
    - "kube-node-lease"

  # Kubernetes LabelSelector to dynamically exclude marked namespaces.
  # Any namespace carrying this label is hidden in UI and blocked in API.
  namespaceExcludeSelector: "kncc.io/exclude=true"

  # Blacklist of node names permanently excluded from probe pod execution.
  # Probes will never be scheduled on these nodes.
  nodeExcludeList: []

  # Kubernetes LabelSelector to dynamically exclude nodes from probe execution.
  # Nodes carrying matching labels (e.g., audit/security nodes) are skipped during check planning.
  # Example: "security.zone=audit" or "node-role.kubernetes.io/control-plane=true" or "kncc.io/exclude=true"
  nodeExcludeSelector: ""

  # Optional whitelist LabelSelector: only schedule probe pods on nodes matching this selector.
  # Example: "node-role.kubernetes.io/worker=true"
  nodeSelector: ""

# ------------------------------------------------------------------------------
# 4. Role-Based Access Control (RBAC & ServiceAccount)
# ------------------------------------------------------------------------------

rbac:
  # Whether to create ServiceAccount, Role/ClusterRole, and RoleBinding resources.
  # Keep true. Only disable if cluster security policies disallow creating RBAC via Helm
  # and require pre-provisioning by cluster administrators.
  create: true

  # Cross-namespace execution mode (Multi-Namespace mode):
  #   - false (default): kncc creates probe pods strictly inside its own release namespace.
  #     Chart creates standard namespaced Role and RoleBinding.
  #   - true: kncc is permitted to schedule probe pods across ANY cluster namespace.
  #     Chart creates ClusterRole and ClusterRoleBinding. Required for evaluating CNI
  #     NetworkPolicies directly from target application pod network contexts.
  multiNamespace: true

  # Toggle printing effective ServiceAccount RBAC permissions (access list) to container logs on startup.
  # When false (default), startup logs remain concise and startup does not query cluster RBAC bindings.
  # Set to true to inspect effective permissions table directly in 'kubectl logs' on boot.
  printAccessList: false

  serviceAccount:
    # Whether to create ServiceAccount resource.
    create: true

    # Name of ServiceAccount to use. If create: false, specify existing SA name.
    name: ""

    # Annotations for ServiceAccount (used for cloud IAM provider integrations):
    #   AWS EKS (IRSA):
    #     eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/kncc-role"
    #   GCP GKE (Workload Identity):
    #     iam.gke.io/gcp-service-account: "kncc-sa@project-id.iam.gserviceaccount.com"
    #   HashiCorp Vault Injector:
    #     vault.hashicorp.com/role: "kncc"
    annotations: {}

# ------------------------------------------------------------------------------
# 5. Security, Anti-SSRF & Rate Limiting
# ------------------------------------------------------------------------------

security:
  # Maximum allowed check requests per minute per authenticated user.
  # Protects Kubernetes API and cluster from DoS and pod flood. Returns HTTP 429 when exceeded.
  rateLimitPerMinute: 30

  # Blacklisted IP CIDR subnets (Anti-SSRF filtering).
  # Blocks probe attempts targeting cloud instance metadata services
  # and node local loopback network interfaces.
  blacklistCIDRs:
    - "169.254.169.254/32" # Cloud instance metadata service (AWS, GCP, Azure, OpenStack)
    - "127.0.0.0/8"         # Node IPv4 Loopback
    - "::1/128"            # Node IPv6 Loopback

  # Blacklisted domain names. Prevents access to cloud metadata via DNS names (Anti-DNS Rebinding).
  blacklistDomains:
    - "metadata.google.internal"
    - "instance-data"

  # Whitelisted IP CIDR subnets (Strict Allowlist mode).
  # If NOT empty, kncc permits network checks ONLY to targets matching these subnets.
  # If empty ([]), checks to all IP addresses are allowed except those in blacklistCIDRs.
  whitelistCIDRs: []

  # Whitelisted domain patterns (Strict Allowlist mode).
  # If NOT empty, checks are restricted exclusively to matching domain patterns.
  whitelistDomains: []

# ------------------------------------------------------------------------------
# 6. Report Storage, Retention and SQLite Persistence
# ------------------------------------------------------------------------------

storage:
  # Retention duration / time-to-live for diagnostic reports (Go duration format: e.g. "24h", "72h", "168h").
  # Reports older than this retention period are automatically removed by the background cleaner routine.
  # Default: "72h" (3 days).
  reportTTL: "72h"

persistence:
  # Use PersistentVolumeClaim for SQLite database storage (/data/kncc.db).
  # WARNING:
  #   - false (default): uses temporary emptyDir volume. On kncc pod restart,
  #     ALL check history, saved reports, and local users WILL BE LOST!
  #   - true: provisions PersistentVolumeClaim, preserving data across restarts.
  #     MANDATORY for production deployment!
  enabled: false

  # StorageClass name for dynamic volume provisioning (e.g. "local-path", "gp3", "ceph-rbd").
  # Leave empty ("") to use cluster default StorageClass.
  storageClass: ""

  # Volume access mode. SQLite requires exclusive mount on a single node, keep ReadWriteOnce.
  accessMode: ReadWriteOnce

  # Storage capacity. 2Gi is sufficient for tens of thousands of diagnostic reports.
  size: 2Gi

  # Mount path inside container. Do not modify without synchronizing server config.
  mountPath: /data

# ------------------------------------------------------------------------------
# 7. Authentication & Access Control (Local, LDAP, OIDC)
# ------------------------------------------------------------------------------

auth:
  # Username of default built-in administrator account.
  adminUsername: "admin"

  # Initial administrator password on first service startup.
  # If left empty ("") and no existingSecret is specified, kncc automatically generates
  # a cryptographically strong random password and prints it to pod logs on first boot.
  adminInitialPassword: ""

  # Name of existing Kubernetes Secret containing administrator password.
  # Recommended for production/GitOps: password securely delivered via Vault or External Secrets.
  existingSecret: ""

  # Key inside existingSecret containing administrator password.
  existingSecretPasswordKey: "ADMIN_INITIAL_PASSWORD"

  # Enable local username and password authentication against SQLite database.
  # Set false to disable local credentials and mandate SSO (LDAP / OIDC).
  localEnabled: true

  # Delivery mode for administrator initial password into container:
  #   - "volume" (default, recommended): mounted as file via tmpfs RAM volume (emptyDir: Memory).
  #     Prevents secret leakage into logs, kubectl describe pod output, or /proc/$PID/environ.
  #   - "env": injects password via ADMIN_INITIAL_PASSWORD environment variable (legacy simple mode).
  deliveryMode: "volume"

  # Volume settings for secure password delivery (used when deliveryMode: "volume").
  volume:
    # Volume storage medium: "Memory" (tmpfs in RAM) or "" (node physical disk).
    medium: "Memory"
    # Memory volume size limit.
    sizeLimit: "64Mi"
    # Mount path inside kncc container.
    mountPath: "/etc/kncc-auth"
    # Filename containing password inside volume.
    fileName: "admin-password"
    # Use initContainer to safely copy password from Secret into RAM volume with 0400 permissions.
    populateFromSecret: true

  # ----------------------------------------------------------------------------
  # LDAP / Active Directory Corporate Directory Authentication
  # ----------------------------------------------------------------------------
  # Enable LDAP / Active Directory login provider.
  ldapEnabled: false
  ldap:
    # Directory server URL. For secure connectivity, ldaps:// on port 636 is strongly recommended.
    url: "ldaps://ldap.corp.example.com:636"

    # Service account Bind DN for Search-and-Bind mode.
    bindDN: "cn=kncc-svc,ou=services,dc=example,dc=com"

    # Service account Bind Password (used when existingSecret is empty).
    bindPassword: ""

    # Name of existing Kubernetes Secret containing LDAP credentials (bindDN and bindPassword).
    # Avoids storing directory passwords in Helm values.
    existingSecret: ""
    existingSecretBindDNKey: "LDAP_BIND_DN"
    existingSecretBindPasswordKey: "LDAP_BIND_PASSWORD"

    # Direct Bind / User Bind Pattern.
    # If specified (e.g., "uid=%s,ou=users,dc=example,dc=com"), kncc formats username
    # and binds directly as user without requiring a privileged service account.
    userDNTemplate: ""

    # RFC 4513 Unauthenticated Bind mode.
    # Allows finding user DN without service credentials.
    anonymousSearch: false

    # Base DN for user account searches.
    baseDN: "ou=users,dc=example,dc=com"

    # User search filter. The %s placeholder is dynamically replaced with entered username.
    userFilter: "(uid=%s)"

    # LDAP Group name or CN whose members are granted administrator role in kncc.
    # Roles are evaluated dynamically upon each user login (kncc RBAC).
    adminGroup: ""

    # Optional LDAP filter for querying user groups (e.g. "(cn=RBAC_KNCC_*)").
    groupFilter: ""

    # Base DN for group queries (falls back to baseDN if empty).
    groupBaseDN: ""

    # Skip TLS certificate verification for LDAP server.
    # WARNING: Setting true disables certificate checks and exposes connections to Man-in-the-Middle attacks!
    # For internal corporate CAs, configure the caCerts section instead of enabling this flag.
    insecureSkipVerify: false

  # ----------------------------------------------------------------------------
  # Single Sign-On (OIDC / OAuth2)
  # ----------------------------------------------------------------------------
  # Enable OpenID Connect integration (Keycloak, Dex, Authentik, Okta, Azure AD).
  oidcEnabled: false
  oidc:
    # OIDC Provider Issuer URL (Discovery Endpoint at <issuerURL>/.well-known/openid-configuration).
    issuerURL: "https://auth.corp.example.com/realms/corp"

    # Client ID registered in Identity Provider.
    clientID: "kncc"

    # Client Secret in plain text (used only if existingSecret is not configured).
    clientSecret: ""

    # Callback Redirect URL registered in IdP client configuration.
    redirectURL: "https://kncc.corp.example.com/api/auth/oidc/callback"

    # Name of existing Kubernetes Secret containing OIDC credentials (clientID and clientSecret).
    existingSecret: ""
    existingSecretClientIDKey: ""
    existingSecretClientSecretKey: "OIDC_CLIENT_SECRET"

# ------------------------------------------------------------------------------
# 8. Trusted Corporate Certificates (Private CA / PKI)
# ------------------------------------------------------------------------------
# Enables end-to-end trust for enterprise private Certificate Authorities (Root CA + Intermediate CA):
#   1. kncc server validates LDAPS and OIDC identity provider certificates.
#   2. kncc-probe pods validate internal HTTPS cluster endpoints with full chain verification
#      without requiring insecure_tls.

caCerts:
  # Enable mounting and loading additional trusted CA certificates.
  enabled: false

  # Option 1: PEM certificate bundle directly in values (Root CA and/or Intermediate).
  # Helm automatically generates a ConfigMap with this bundle.
  pem: ""

  # Option 2: Name of existing ConfigMap containing CA certificate (e.g. from cert-manager trust-manager).
  existingConfigMap: ""

  # Option 3: Name of existing Secret containing CA certificate.
  existingSecret: ""

  # Key inside ConfigMap or Secret containing CA certificate (default: "ca.crt").
  certKey: "ca.crt"

  # Certificate mount path inside kncc server container.
  mountPath: "/etc/ssl/kncc-ca"

  # Option 4: cert-manager integration for automated CA retrieval from cluster issuer.
  certManager:
    enabled: false
    issuerRef:
      name: ""              # Name of ClusterIssuer or Issuer CA
      kind: "ClusterIssuer"
      group: "cert-manager.io"
    duration: "8760h"
    renewBefore: "720h"
    commonName: ""          # Default: {{ include "kncc.fullname" . }}-ca

# ------------------------------------------------------------------------------
# 9. Corporate Branding, Theming & Localization
# ------------------------------------------------------------------------------

theme:
  # Service name displayed in Web UI navbar and browser tab title.
  appName: "Kubernetes Network Connectivity Checker"

  # Theme primary background color (HEX). Sets background color for cards and panels.
  primaryColor: "#ffffff"

  # Brand accent color (HEX). Applied to action buttons ("Run Check"), status badges, and progress indicators.
  accentColor: "#dc2626"

  # Default system theme for new user sessions ("light" or "dark").
  defaultTheme: "light"

  # Default user interface language ("en" or "ru").
  # Applied on first visit before user selection is stored in browser localStorage.
  defaultLanguage: "en"

logo:
  # Whether to create Kubernetes ConfigMap for storing custom corporate logo.
  enabled: true

  # Logo image data in Base64 or raw SVG string.
  # If empty (""), kncc displays built-in high-quality shipbuilding vector logo.
  data: ""

  # MIME type for uploaded logo (image/svg+xml, image/png, image/jpeg, image/webp).
  mimeType: "image/svg+xml"

favicon:
  # Whether to create Kubernetes ConfigMap for storing custom site favicon.
  enabled: true

  # Favicon image data in Base64 or raw SVG string.
  # If empty (""), kncc automatically generates favicon thumbnail from active corporate logo.
  data: ""

  # MIME type for favicon (image/svg+xml, image/png, image/x-icon, image/vnd.microsoft.icon, image/webp).
  mimeType: "image/svg+xml"

quickAdd:
  # Quick-add diagnostic target presets (1 to 3 services).
  # Rendered as interactive chips on the New Check page for one-click setup.
  presets:
    - name: "K8s API"
      protocol: "tcp"
      host: "10.96.0.1"
      port: 443
    - name: "Google DNS"
      protocol: "icmp"
      host: "8.8.8.8"

# ------------------------------------------------------------------------------
# 10. Service Publishing & Routing (Service, Ingress, Gateway API)
# ------------------------------------------------------------------------------

service:
  # Kubernetes Service type:
  #   - ClusterIP (default): reachable internally or via Ingress/Gateway.
  #   - NodePort: exposes static port on each cluster node (for isolated test labs).
  #   - LoadBalancer: provisions external cloud load balancer (MetalLB, AWS NLB, GCP LB).
  type: ClusterIP

  # Internal Kubernetes service port for HTTP traffic.
  port: 80

  # Target container port on kncc pod (matches server.port).
  targetPort: 8080

  # Internal Kubernetes service port for HTTPS traffic (when server.tls.enabled: true).
  tlsPort: 443

ingress:
  # Enable routing via standard Kubernetes Ingress controller.
  enabled: false

  # Ingress controller class name (e.g. "traefik", "nginx", "haproxy").
  className: "traefik"

  # Ingress annotations (cert-manager integration, buffer tuning, timeouts).
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod

  # Host and path routing rules:
  hosts:
    - host: kncc.example.com
      paths:
        - path: /
          pathType: Prefix

  # Ingress TLS termination configurations:
  tls: []
  #  - secretName: kncc-tls
  #    hosts:
  #      - kncc.example.com

gateway:
  # Enable modern routing using Kubernetes Gateway API (gateway.networking.k8s.io/v1 HTTPRoute).
  # Alternative or successor to classic Ingress.
  enabled: false

  # Annotations and labels for created HTTPRoute resource.
  annotations: {}
  labels: {}

  # References to parent Gateway resources accepting traffic for this route.
  parentRefs:
    - name: default-gateway
      # namespace: gateway-system
      # sectionName: http
      # port: 80
      # group: gateway.networking.k8s.io
      # kind: Gateway

  # Hostnames routed to kncc service.
  hostnames:
    - kncc.example.com

  # Custom routing rules, filters, and header rewrites.
  # If empty ([]), defaults to standard PathPrefix: "/" forwarding.
  rules: []

  # Whether to create dedicated Gateway resource directly via chart (for standalone deployments).
  createGateway: false
  gatewayName: "" # Default: {{ include "kncc.fullname" . }}
  gatewayClassName: "traefik"
  gatewayAnnotations: {}
  gatewayLabels: {}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

# ------------------------------------------------------------------------------
# 11. Pod Health Probes (Startup, Liveness, Readiness)
# ------------------------------------------------------------------------------

probes:
  # Startup Probe.
  # Probes /api/startupz during pod initialization.
  # Gives kncc sufficient time to mount volumes, run SQLite migrations,
  # and audit RBAC permissions, preventing early restarts by Liveness Probe.
  startup:
    enabled: true
    path: /api/startupz
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12 # 12 attempts * 5s = up to 60s for startup initialization

  # Liveness Probe.
  # Probes /api/livez. Monitors HTTP server responsiveness and Go runtime health.
  # On process deadlock, Kubernetes automatically restarts the container.
  liveness:
    enabled: true
    path: /api/livez
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  # Readiness Probe.
  # Probes /api/readyz. Actively tests SQLite database accessibility (PingContext).
  # If database is unavailable, pod is temporarily removed from Service endpoints without crashing.
  readiness:
    enabled: true
    path: /api/readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

# ------------------------------------------------------------------------------
# 12. Container Resources & Scheduling
# ------------------------------------------------------------------------------

# CPU and Memory resource limits and requests for kncc server container.
# kncc is a lightweight Go service: baseline footprint is ~50m CPU and ~64Mi RAM.
# Memory may transiently spike during heavy concurrent cluster-wide checks.
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Node label selector for scheduling kncc server pod (e.g. "kubernetes.io/os: linux").
nodeSelector: {}

# Tolerations for scheduling kncc server pod on tainted nodes.
# Note: ephemeral kncc-probe diagnostic pods automatically receive system tolerations (operator: Exists)
# to probe all cluster nodes regardless of this setting.
tolerations: []

# Node and pod affinity rules (Affinity / Anti-Affinity) for advanced scheduling.
affinity: {}
