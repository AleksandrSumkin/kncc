{{- if and .Values.caCerts .Values.caCerts.enabled .Values.caCerts.certManager .Values.caCerts.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kncc.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
spec:
  secretName: {{ include "kncc.fullname" . }}-ca-cert
  issuerRef:
    name: {{ required "caCerts.certManager.issuerRef.name is required when certManager is enabled" .Values.caCerts.certManager.issuerRef.name }}
    kind: {{ .Values.caCerts.certManager.issuerRef.kind | default "ClusterIssuer" }}
    {{- if .Values.caCerts.certManager.issuerRef.group }}
    group: {{ .Values.caCerts.certManager.issuerRef.group }}
    {{- end }}
  commonName: {{ .Values.caCerts.certManager.commonName | default (printf "%s-ca" (include "kncc.fullname" .)) }}
  duration: {{ .Values.caCerts.certManager.duration | default "8760h" }}
  renewBefore: {{ .Values.caCerts.certManager.renewBefore | default "720h" }}
  usages:
    - digital signature
    - key encipherment
    - client auth
{{- end }}
