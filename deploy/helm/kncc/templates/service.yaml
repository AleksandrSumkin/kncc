apiVersion: v1
kind: Service
metadata:
  name: {{ include "kncc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and .Values.server.tls .Values.server.tls.enabled }}
    - port: {{ .Values.service.tlsPort | default 443 }}
      targetPort: https
      protocol: TCP
      name: https
    {{- end }}
  selector:
    {{- include "kncc.selectorLabels" . | nindent 4 }}
