{{- if and .Values.server.tls .Values.server.tls.enabled .Values.server.tls.certManager .Values.server.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kncc.fullname" . }}-server-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
spec:
  secretName: {{ include "kncc.serverTlsSecretName" . }}
  issuerRef:
    name: {{ required "server.tls.certManager.issuerRef.name is required when certManager is enabled" .Values.server.tls.certManager.issuerRef.name }}
    kind: {{ .Values.server.tls.certManager.issuerRef.kind | default "ClusterIssuer" }}
    {{- if .Values.server.tls.certManager.issuerRef.group }}
    group: {{ .Values.server.tls.certManager.issuerRef.group }}
    {{- end }}
  commonName: {{ include "kncc.fullname" . }}
  dnsNames:
    - {{ include "kncc.fullname" . }}
    - {{ include "kncc.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "kncc.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "kncc.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
    {{- with .Values.server.tls.certManager.dnsNames }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.tls.certManager.ipAddresses }}
  ipAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  duration: {{ .Values.server.tls.certManager.duration | default "8760h" }}
  renewBefore: {{ .Values.server.tls.certManager.renewBefore | default "720h" }}
  usages:
    - digital signature
    - key encipherment
    - server auth
{{- end }}
