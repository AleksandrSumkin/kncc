{{- if .Values.rbac.create -}}
# 1. ClusterRole to list and watch all nodes in the cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kncc.fullname" . }}-node-viewer
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.k8s.namespaceListEnabled }}
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kncc.fullname" . }}-node-viewer
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kncc.fullname" . }}-node-viewer
subjects:
  - kind: ServiceAccount
    name: {{ include "kncc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

{{- if .Values.rbac.multiNamespace }}
---
# 2. Multi-namespace enabled: ClusterRole to manage probe pods in any user-selected namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kncc.fullname" . }}-probe-executor
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kncc.fullname" . }}-probe-executor
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kncc.fullname" . }}-probe-executor
subjects:
  - kind: ServiceAccount
    name: {{ include "kncc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

{{- else }}
---
# 2. Multi-namespace disabled: Role restricted to release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kncc.fullname" . }}-probe-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kncc.fullname" . }}-probe-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kncc.fullname" . }}-probe-executor
subjects:
  - kind: ServiceAccount
    name: {{ include "kncc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# 3. Role to manage branding ConfigMaps within the release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kncc.fullname" . }}-configmap-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kncc.fullname" . }}-configmap-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kncc.fullname" . }}-configmap-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "kncc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
