{{- if include "kncc.createSecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kncc.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kncc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.auth.existingSecret) .Values.auth.adminInitialPassword }}
  ADMIN_INITIAL_PASSWORD: {{ .Values.auth.adminInitialPassword | quote }}
  {{- end }}
  {{- if and .Values.auth.ldapEnabled .Values.auth.ldap.bindPassword (not .Values.auth.ldap.existingSecret) }}
  LDAP_BIND_PASSWORD: {{ .Values.auth.ldap.bindPassword | quote }}
  {{- end }}
  {{- if and .Values.auth.oidcEnabled .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) }}
  OIDC_CLIENT_SECRET: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
