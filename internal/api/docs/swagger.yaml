basePath: /
definitions:
  internal_api.AuthProvidersResponse:
    properties:
      oidc_auth_url:
        example: http://dex:5556/auth
        type: string
      providers:
        items:
          type: string
        type: array
    type: object
  internal_api.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/kncc_internal_model.Role'
      username:
        type: string
    type: object
  internal_api.CreateUserResponse:
    properties:
      user:
        $ref: '#/definitions/kncc_internal_model.User'
    type: object
  internal_api.ErrorResponse:
    properties:
      error:
        example: invalid request parameter
        type: string
    type: object
  internal_api.LoginRequest:
    properties:
      password:
        type: string
      provider:
        description: '"local", "ldap"'
        type: string
      username:
        type: string
    type: object
  internal_api.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/kncc_internal_model.User'
    type: object
  internal_api.MessageResponse:
    properties:
      message:
        example: operation completed successfully
        type: string
    type: object
  internal_api.NamespacesResponse:
    properties:
      namespaces:
        items:
          type: string
        type: array
      source:
        example: cluster
        type: string
    type: object
  internal_api.QuickAddResponse:
    properties:
      quick_add:
        items:
          $ref: '#/definitions/kncc_internal_model.TargetService'
        type: array
    type: object
  internal_api.ReportsResponse:
    properties:
      reports:
        items:
          $ref: '#/definitions/kncc_internal_model.Report'
        type: array
    type: object
  internal_api.StatusOKResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  internal_api.SystemConfigResponse:
    properties:
      accent_color:
        example: '#dc2626'
        type: string
      app_name:
        example: Kubernetes Network Connectivity Checker
        type: string
      auth_providers:
        items:
          type: string
        type: array
      default_language:
        example: en
        type: string
      default_namespace:
        example: kncc
        type: string
      default_theme:
        example: light
        type: string
      favicon_url:
        example: /api/system/favicon?v=123
        type: string
      has_custom_favicon:
        example: false
        type: boolean
      has_custom_logo:
        example: false
        type: boolean
      logo_url:
        example: /api/system/logo?v=123
        type: string
      multi_namespace_allowed:
        example: false
        type: boolean
      namespace_list_enabled:
        example: true
        type: boolean
      primary_color:
        example: '#ffffff'
        type: string
      quick_add_presets:
        items:
          $ref: '#/definitions/kncc_internal_config.QuickAddPreset'
        type: array
      rate_limit_per_minute:
        example: 30
        type: integer
      version:
        example: 1.11.0
        type: string
    type: object
  internal_api.UpdateThemeSettingsRequest:
    properties:
      default_language:
        type: string
      default_theme:
        type: string
    type: object
  internal_api.UploadFaviconRequestJSON:
    properties:
      data:
        description: raw SVG or base64 data URL / raw base64
        type: string
      mime_type:
        description: optional MIME type hint
        type: string
    type: object
  internal_api.UploadLogoRequestJSON:
    properties:
      data:
        description: raw SVG or base64 data URL
        type: string
      mime_type:
        description: optional MIME type hint
        type: string
    type: object
  internal_api.UsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/kncc_internal_model.User'
        type: array
    type: object
  kncc_internal_config.QuickAddPreset:
    properties:
      host:
        type: string
      insecure_tls:
        type: boolean
      name:
        type: string
      path:
        type: string
      port:
        type: integer
      protocol:
        $ref: '#/definitions/kncc_internal_model.Protocol'
      timeout_seconds:
        type: integer
    type: object
  kncc_internal_k8s_rbac.PolicyRule:
    properties:
      api_group:
        description: '"core" or named group'
        type: string
      namespace:
        description: '"*" or namespace name'
        type: string
      non_resource_urls:
        description: '["/healthz", ...]'
        items:
          type: string
        type: array
      originated_from:
        description: '"ClusterRole/kncc-node-viewer", etc.'
        type: string
      resource:
        description: '"pods", "nodes", "namespaces", etc.'
        type: string
      resource_names:
        description: '["*"] or specific names'
        items:
          type: string
        type: array
      subject:
        description: '"namespace/name" or "name"'
        type: string
      type:
        description: '"ServiceAccount" or "User"'
        type: string
      verbs:
        description: '["get", "list", "watch"]'
        items:
          type: string
        type: array
    type: object
  kncc_internal_k8s_rbac.RBACReport:
    properties:
      evaluation_error:
        type: string
      generated_at:
        type: string
      rules:
        items:
          $ref: '#/definitions/kncc_internal_k8s_rbac.PolicyRule'
        type: array
      source:
        description: '"cluster-rbac", "self-subject-rules-review", "mock"'
        type: string
      subject:
        $ref: '#/definitions/kncc_internal_k8s_rbac.SubjectInfo'
    type: object
  kncc_internal_k8s_rbac.SubjectInfo:
    properties:
      kind:
        description: '"ServiceAccount" or "User"'
        type: string
      name:
        description: e.g. "kncc"
        type: string
      namespace:
        description: e.g. "kncc" (empty for cluster users)
        type: string
      raw_username:
        description: e.g. "system:serviceaccount:kncc:kncc"
        type: string
    type: object
  kncc_internal_model.CertStatus:
    enum:
    - valid
    - expiring_soon
    - expired
    type: string
    x-enum-varnames:
    - CertStatusValid
    - CertStatusExpiringSoon
    - CertStatusExpired
  kncc_internal_model.CheckMode:
    enum:
    - host
    - pod
    type: string
    x-enum-varnames:
    - ModeHostNetwork
    - ModePodNetwork
  kncc_internal_model.CheckRequest:
    properties:
      mode:
        $ref: '#/definitions/kncc_internal_model.CheckMode'
      namespace:
        type: string
      targets:
        items:
          $ref: '#/definitions/kncc_internal_model.TargetService'
        type: array
    type: object
  kncc_internal_model.NodeResult:
    properties:
      duration_ms:
        type: integer
      error:
        type: string
      finished_at:
        type: string
      node_ip:
        type: string
      node_name:
        type: string
      service_results:
        items:
          $ref: '#/definitions/kncc_internal_model.ProbeOutput'
        type: array
      status:
        description: '"completed", "failed", "timeout", "running"'
        type: string
    type: object
  kncc_internal_model.ProbeOutput:
    properties:
      cert_days_left:
        type: integer
      cert_expiry:
        type: string
      cert_issuer:
        type: string
      cert_status:
        $ref: '#/definitions/kncc_internal_model.CertStatus'
      cert_subject:
        type: string
      details:
        type: string
      error:
        type: string
      http_status_code:
        type: integer
      latency_ms:
        type: integer
      resolved_ip:
        type: string
      success:
        type: boolean
      target:
        $ref: '#/definitions/kncc_internal_model.TargetService'
    type: object
  kncc_internal_model.Protocol:
    enum:
    - tcp
    - udp
    - http
    - https
    - icmp
    type: string
    x-enum-varnames:
    - ProtocolTCP
    - ProtocolUDP
    - ProtocolHTTP
    - ProtocolHTTPS
    - ProtocolICMP
  kncc_internal_model.Report:
    properties:
      completed_at:
        type: string
      completed_nodes:
        type: integer
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      mode:
        $ref: '#/definitions/kncc_internal_model.CheckMode'
      namespace:
        type: string
      node_results:
        additionalProperties:
          $ref: '#/definitions/kncc_internal_model.NodeResult'
        type: object
      status:
        $ref: '#/definitions/kncc_internal_model.ReportStatus'
      targets:
        items:
          $ref: '#/definitions/kncc_internal_model.TargetService'
        type: array
      total_nodes:
        type: integer
      user_id:
        type: string
      username:
        type: string
    type: object
  kncc_internal_model.ReportStatus:
    enum:
    - pending
    - running
    - completed
    - failed
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusCompleted
    - StatusFailed
  kncc_internal_model.Role:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
  kncc_internal_model.TargetService:
    properties:
      host:
        type: string
      insecure_tls:
        type: boolean
      name:
        type: string
      path:
        type: string
      port:
        type: integer
      protocol:
        $ref: '#/definitions/kncc_internal_model.Protocol'
      timeout_seconds:
        type: integer
    type: object
  kncc_internal_model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      provider:
        description: '"local", "ldap", "oidc"'
        type: string
      role:
        $ref: '#/definitions/kncc_internal_model.Role'
      username:
        type: string
    type: object
  kncc_internal_model.UserStats:
    properties:
      day_count:
        type: integer
      last_active:
        type: string
      month_count:
        type: integer
      provider:
        type: string
      role:
        $ref: '#/definitions/kncc_internal_model.Role'
      total_count:
        type: integer
      user_id:
        type: string
      username:
        type: string
      week_count:
        type: integer
      year_count:
        type: integer
    type: object
  kncc_internal_model.UserStatsResponse:
    properties:
      total:
        $ref: '#/definitions/kncc_internal_model.UserStatsSummary'
      users:
        items:
          $ref: '#/definitions/kncc_internal_model.UserStats'
        type: array
    type: object
  kncc_internal_model.UserStatsSummary:
    properties:
      day_count:
        type: integer
      month_count:
        type: integer
      total_count:
        type: integer
      week_count:
        type: integer
      year_count:
        type: integer
    type: object
info:
  contact:
    name: kncc Maintainers
  description: kncc server REST API for network connectivity diagnostics in Kubernetes
    clusters.
  license:
    name: Apache 2.0
  title: Kubernetes Network Connectivity Checker (kncc) API
  version: 1.15.0
paths:
  /api/admin/rbac:
    get:
      description: Admin endpoint to inspect current ServiceAccount RBAC rules and
        node access
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kncc_internal_k8s_rbac.RBACReport'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Inspect cluster RBAC permissions
      tags:
      - admin
  /api/admin/settings/favicon:
    delete:
      description: Admin endpoint to reset favicon back to corporate logo thumbnail
        default
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reset favicon to default
      tags:
      - admin
    post:
      consumes:
      - multipart/form-data
      - application/json
      description: Admin endpoint to upload custom favicon (ICO, SVG, PNG)
      parameters:
      - description: Favicon image file (ICO, SVG, PNG, max 512KB)
        in: formData
        name: favicon
        type: file
      - description: JSON payload with raw SVG or base64 favicon data
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_api.UploadFaviconRequestJSON'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload custom favicon
      tags:
      - admin
  /api/admin/settings/logo:
    delete:
      description: Admin endpoint to reset logo back to default shipbuilding vector
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reset corporate logo to default
      tags:
      - admin
    post:
      consumes:
      - multipart/form-data
      - application/json
      description: Admin endpoint to upload custom corporate SVG/PNG/JPEG logo
      parameters:
      - description: Logo image file (SVG, PNG, JPEG, WebP, max 1MB)
        in: formData
        name: logo
        type: file
      - description: JSON payload with raw SVG or base64 image data
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_api.UploadLogoRequestJSON'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload corporate logo
      tags:
      - admin
  /api/admin/settings/theme:
    put:
      consumes:
      - application/json
      description: Admin endpoint to update default theme (light/dark) and language
        (en/ru)
      parameters:
      - description: Theme setting payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.UpdateThemeSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusOKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update system theme setting
      tags:
      - admin
  /api/admin/stats/users:
    get:
      description: Admin endpoint returning aggregate check counts per user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kncc_internal_model.UserStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user diagnostic request statistics
      tags:
      - admin
  /api/admin/users:
    get:
      description: Admin endpoint to list all registered users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.UsersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Admin endpoint to create a new local user
      parameters:
      - description: User creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/kncc_internal_model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new user
      tags:
      - admin
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user via local credentials or LDAP, returning a
        JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: User login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Clears the authentication session and cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.MessageResponse'
      summary: User logout
      tags:
      - auth
  /api/auth/me:
    get:
      description: Returns the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.CreateUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /api/auth/oidc/callback:
    get:
      description: Exchanges authorization code with OIDC provider and issues JWT
        token
      parameters:
      - description: Authorization code
        in: query
        name: code
        type: string
      - description: Error code from IdP
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: OIDC callback handler
      tags:
      - auth
    post:
      description: Exchanges authorization code with OIDC provider and issues JWT
        token
      parameters:
      - description: Authorization code
        in: query
        name: code
        type: string
      - description: Error code from IdP
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: OIDC callback handler
      tags:
      - auth
  /api/auth/oidc/login:
    get:
      description: Redirects client to configured OIDC / Dex identity provider
      parameters:
      - description: Optional state parameter
        in: query
        name: state
        type: string
      responses:
        "302":
          description: Redirect to IdP authorization endpoint
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Initiate OIDC Single Sign-On
      tags:
      - auth
  /api/auth/providers:
    get:
      description: Returns list of active login methods (local, ldap, oidc)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.AuthProvidersResponse'
      summary: Get active authentication providers
      tags:
      - auth
  /api/checks:
    post:
      consumes:
      - application/json
      description: Creates a new network probe check job between Kubernetes pods/targets
      parameters:
      - description: Connectivity check specification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/kncc_internal_model.CheckRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/kncc_internal_model.Report'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit network connectivity check
      tags:
      - checks
  /api/checks/quick-add:
    get:
      description: Returns personalized or default quick-add diagnostic targets
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.QuickAddResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get quick-add diagnostic targets
      tags:
      - checks
  /api/healthz:
    get:
      description: Legacy endpoint delegating to readiness check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusOKResponse'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: General health check probe
      tags:
      - system
  /api/k8s/namespaces:
    get:
      description: Returns list of accessible namespaces if namespace listing is enabled
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.NamespacesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List allowed Kubernetes namespaces
      tags:
      - k8s
  /api/livez:
    get:
      description: Returns 200 OK if the HTTP server process is running and alive
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusOKResponse'
      summary: Kubernetes liveness probe
      tags:
      - system
  /api/readyz:
    get:
      description: Verifies critical service dependencies such as the SQLite storage
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusOKResponse'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Kubernetes readiness probe
      tags:
      - system
  /api/reports:
    get:
      description: Returns paginated connectivity check reports for current user (or
        all if admin)
      parameters:
      - description: 'Pagination limit (default: 20)'
        in: query
        name: limit
        type: integer
      - description: 'Pagination offset (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ReportsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List connectivity reports
      tags:
      - checks
  /api/reports/{id}:
    get:
      description: Returns full diagnostic results for a specific check report
      parameters:
      - description: Report UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kncc_internal_model.Report'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get connectivity report by ID
      tags:
      - checks
  /api/reports/{id}/rerun:
    post:
      description: Re-executes targets from an existing report under current user
      parameters:
      - description: Report UUID to rerun
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/kncc_internal_model.Report'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rerun existing connectivity check
      tags:
      - checks
  /api/startupz:
    get:
      description: Validates that bootstrapping (database migrations, admin setup,
        auth initialization) is complete
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusOKResponse'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Kubernetes startup probe
      tags:
      - system
  /api/system/config:
    get:
      description: Returns public theme, features, branding, and auth provider configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.SystemConfigResponse'
      summary: Get system configuration
      tags:
      - system
  /api/system/favicon:
    get:
      description: Serves active favicon (custom favicon or fallback to corporate
        logo thumbnail)
      produces:
      - image/x-icon
      - image/svg+xml
      - image/png
      responses:
        "200":
          description: Binary favicon content
          schema:
            type: string
        "304":
          description: Not modified
          schema:
            type: string
      summary: Get system favicon
      tags:
      - system
  /api/system/logo:
    get:
      description: Serves active logo (custom or default shipbuilding logo) with HTTP
        caching
      produces:
      - image/svg+xml
      - image/png
      - image/jpeg
      - image/webp
      responses:
        "200":
          description: Binary image content
          schema:
            type: string
        "304":
          description: Not modified
          schema:
            type: string
      summary: Get system logo
      tags:
      - system
  /favicon.ico:
    get:
      description: Serves active favicon (custom favicon or fallback to corporate
        logo thumbnail)
      produces:
      - image/x-icon
      - image/svg+xml
      - image/png
      responses:
        "200":
          description: Binary favicon content
          schema:
            type: string
        "304":
          description: Not modified
          schema:
            type: string
      summary: Get system favicon
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: Enter 'Bearer <JWT_TOKEN>' to authenticate protected requests.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
